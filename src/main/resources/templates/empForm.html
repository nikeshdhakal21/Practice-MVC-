<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
	<meta charset="ISO-8859-1">
	<title>employee</title>
</head>

<body>

	

			
				<h1>Employee Details</h1>



				<form action="/employee" method="post">

					
						FirstName <input type="text" name="fname" ><br><br>
						
						LastName	<input type="text" name="lname" ><br><br>
						
					Gender <input type="radio" name="gender" value="male"> Male
							<input type="radio" name="gender" value="female"> Female<br><br>

					Phone <input type="text" name="phone"><br><br>
					DoB <input type="date" name="dob"><br><br>

					Email<input type="email" name="email"><br><br>

					Post <input type="text" name="post" ><br><br>
					JoinDate<input type="date" name="joinDate"><br><br>
					

					


					
							 
					Department		<select name="departments" >
								
								<option value="">Select</option>
								<option th:each="d : ${dList}" th:value="${d.deptId}" > [[${d.deptName}]] </option>
								
							</select><br><br>
							
					Salary<input type="number" name="salary"><br><br>


					 Country<input type="text" name="address.country" ><br><br>



					City<input type="text" name="address.city"><br><br>
					 State<select name="address.state" >
								<option value="">select</option>
								<option value="state-1">State-1</option>
								<option value="state-2">State-2</option>
								<option value="state-3">State-3</option>
								<option value="state-4">State-4</option>
								<option value="state-5">State-5</option>
								<option value="state-6">State-6</option>
								<option value="state-7">State-7</option>
							</select><br><br>


					


					 ZipCode
							<input type="text" name="address.zipcode" ><br><br>
						


					 Projects<br><br> 
						
							<input type="checkbox" name="projects" value="project-1"> Project-1<br><br>
							<input type="checkbox" name="projects" value="project-2"> Project-2<br><br>
							<input type="checkbox" name="projects" value="project-3"> Project-3<br><br>
							<input type="checkbox" name="projects" value="project-4"> Project-4<br><br>
							<input type="checkbox" name="projects" value="project-5"> Project-5<br><br>
						


							<input type="submit" value="Add Employee" >
							
							</form>
				

</body>

</html>
